version: '3.8'

services:
  db:
    image: mariadb:latest
    container_name: veriaguide_wp_db_prod
    volumes:
      - mysql-data-prod:/var/lib/mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    networks:
      - wp_veria_network_prod
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  wordpress:
    depends_on:
      - db
    image: wordpress:latest
    container_name: wp_veriaguide_prod
    ports:
      - "${WP_PORT:-8086}:80"
    volumes:
      - wp-content-prod:/var/www/html/wp-content
    restart: always
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: ${MYSQL_USER}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
      WORDPRESS_DEBUG: 'false'
      WORDPRESS_DEBUG_LOG: 'false'
      WORDPRESS_DEBUG_DISPLAY: 'false'
      DISALLOW_FILE_EDIT: 'true'
    networks:
      - wp_veria_network_prod
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  redis:
    image: redis:7-alpine
    container_name: veriaguide_redis_prod
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data-prod:/data
    restart: always
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - wp_veria_network_prod
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  frontend:
    depends_on:
      - wordpress
      - redis
    build:
      context: ./frontend
      dockerfile: Dockerfile.production
    container_name: veriaguide_frontend_prod
    ports:
      - "${FRONTEND_PORT:-8000}:8000"
    volumes:
      - ./frontend/logs:/app/logs
    restart: always
    environment:
      ENVIRONMENT: production
      WP_API_URL: ${WP_API_URL:-http://wordpress:80/wp-json/wp/v2}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost}
      SITE_URL: ${SITE_URL:-https://veriaguide.com}
      LOG_LEVEL: WARNING
      WORKERS: ${WORKERS:-4}
      CACHE_EXPIRY: ${CACHE_EXPIRY:-7200}
      REDIS_DEFAULT_TTL: ${REDIS_DEFAULT_TTL:-3600}
    networks:
      - wp_veria_network_prod
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/admin/cache-health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  mysql-data-prod:
  wp-content-prod:
  redis-data-prod:

networks:
  wp_veria_network_prod:
    driver: bridge