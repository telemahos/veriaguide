<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e9ecef;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:transparent;stop-opacity:1" />
      <stop offset="50%" style="stop-color:rgba(255,255,255,0.4);stop-opacity:1" />
      <stop offset="100%" style="stop-color:transparent;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)" stroke="#dee2e6" stroke-width="2" stroke-dasharray="10,5"/>
  <rect width="400" height="300" fill="url(#shimmer)" opacity="0.5">
    <animateTransform attributeName="transform" type="translate" values="-400,0;400,0;-400,0" dur="2s" repeatCount="indefinite"/>
  </rect>
  <circle cx="200" cy="120" r="30" fill="#6c757d" opacity="0.3"/>
  <rect x="180" y="100" width="40" height="30" fill="#6c757d" opacity="0.4" rx="5"/>
  <circle cx="190" cy="110" r="3" fill="#6c757d"/>
  <polygon points="170,140 200,110 230,140" fill="none" stroke="#6c757d" stroke-width="2" opacity="0.5"/>
  <text x="200" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#6c757d">VeriaGuide</text>
  <text x="200" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#6c757d" opacity="0.7">No Image Available</text>
</svg>