        <h2>{{ "Planning your days in Veria"|t }}</h2>
        <ol class="ag-loading__steps">
            <li><i class="fas fa-magnifying-glass-location" aria-hidden="true"></i> {{ "Choosing the best places for you"|t }}</li>
