{# Save & Share — pinned to bottom of detail sidebar #}
{% set display = item.title.rendered|split_display_title %}
{% set share_title = display.title|urlencode %}

<div class="detail-sidebar-card detail-sidebar-card--actions">
    <h3 class="detail-sidebar-card__title">Save &amp; Share</h3>
    <button type="button" class="btn btn-outline-danger w-100 mb-3 add-favorite detail-sidebar-favorite"
        data-id="{{ item.id }}" data-type="{{ post_type }}"
        data-title="{{ item.title.rendered|striptags }}"
        data-image="{{ featured_image }}">
        <i class="far fa-heart me-2" aria-hidden="true"></i>Add to Favorites
    </button>
    <div class="detail-share-buttons" role="group" aria-label="Share this page">
        <a href="https://www.facebook.com/sharer/sharer.php?u={{ meta.url|urlencode }}" target="_blank"
            rel="noopener noreferrer" class="detail-share-btn" aria-label="Share on Facebook">
            <i class="fab fa-facebook-f" aria-hidden="true"></i>
        </a>
        <a href="https://twitter.com/intent/tweet?url={{ meta.url|urlencode }}&text={{ share_title }}"
            target="_blank" rel="noopener noreferrer" class="detail-share-btn" aria-label="Share on X">
            <i class="fab fa-twitter" aria-hidden="true"></i>
        </a>
        <a href="https://wa.me/?text={{ share_title }}%20{{ meta.url|urlencode }}" target="_blank"
            rel="noopener noreferrer" class="detail-share-btn" aria-label="Share on WhatsApp">
            <i class="fab fa-whatsapp" aria-hidden="true"></i>
        </a>
        <a href="mailto:?subject={{ share_title }}&body={{ meta.url|urlencode }}" class="detail-share-btn"
            aria-label="Share by email">
            <i class="fas fa-envelope" aria-hidden="true"></i>
        </a>
    </div>
</div>
