<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - VeriaGuide</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #0b6ffd 0%, #0a5dd4 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .error-container {
            background: white;
            border-radius: 20px;
            padding: 60px 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 600px;
            animation: fadeIn 0.5s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .error-icon {
            font-size: 100px;
            color: #0b6ffd;
            margin-bottom: 20px;
        }
        h1 {
            color: #2c3e50;
            font-size: 6em;
            font-weight: bold;
            margin: 0;
            background: linear-gradient(135deg, #0b6ffd 0%, #0a5dd4 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        h2 {
            color: #34495e;
            margin: 20px 0;
        }
        p {
            color: #7f8c8d;
            font-size: 1.1em;
            margin: 20px 0;
        }
        .btn-home {
            background: linear-gradient(135deg, #0b6ffd 0%, #0a5dd4 100%);
            color: white;
            padding: 15px 40px;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            display: inline-block;
            margin-top: 20px;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .btn-home:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(11, 111, 253, 0.4);
            color: white;
        }
        .suggestions {
            margin-top: 30px;
            text-align: left;
        }
        .suggestions a {
            color: #0b6ffd;
            text-decoration: none;
            display: block;
            padding: 10px;
            border-radius: 5px;
            transition: background 0.3s;
        }
        .suggestions a:hover {
            background: #f8f9fa;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-icon">
            <i class="fas fa-map-marked-alt"></i>
        </div>
        <h1>404</h1>
        <h2>Page Not Found</h2>
        <p>The page you're looking for doesn't exist. Maybe you took a wrong turn?</p>
        
        <a href="/" class="btn-home">
            <i class="fas fa-home me-2"></i>Back to Home
        </a>
        
        <div class="suggestions">
            <p><strong>Popular Pages:</strong></p>
            <a href="/restaurants"><i class="fas fa-utensils me-2"></i>Restaurants</a>
            <a href="/museums"><i class="fas fa-landmark me-2"></i>Museums</a>
            <a href="/religious-sites"><i class="fas fa-church me-2"></i>Religious Sites</a>
            <a href="/map"><i class="fas fa-map me-2"></i>Map</a>
        </div>
    </div>
</body>
</html>
